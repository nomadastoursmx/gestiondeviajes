<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Agencia de Viajes</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-nav {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(45deg, #ff9800, #f57c00);
            color: white;
        }

        .btn-whatsapp {
            background: linear-gradient(45deg, #25D366, #128C7E);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .content-area {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .trips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .trip-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 1px solid #eee;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .trip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .trip-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .trip-destination {
            color: #666;
            font-size: 1rem;
        }

        .trip-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .trip-details {
            margin-bottom: 15px;
        }

        .trip-dates {
            color: #555;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .trip-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 15px;
        }

        .trip-description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .clients-section {
            border-top: 2px solid #f0f0f0;
            padding-top: 15px;
        }

        .clients-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .client-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #4CAF50;
        }

        .client-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .client-payment {
            font-size: 0.9rem;
            color: #666;
        }

        .payment-pending {
            color: #f44336;
            font-weight: bold;
        }

        .payment-complete {
            color: #4CAF50;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #000;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .summary-card h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .summary-card p {
            opacity: 0.9;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: #4CAF50;
        }

        .notification.error {
            background: #f44336;
        }

        .notification.warning {
            background: #ff9800;
        }

        .payment-history {
            margin-top: 15px;
        }

        .payment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border-radius: 6px;
            margin-bottom: 5px;
            border-left: 3px solid #2196F3;
        }

        .expenses-section {
            border-top: 2px solid #f0f0f0;
            padding-top: 15px;
            margin-top: 15px;
        }

        .expenses-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #fff3e0;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #ff9800;
        }

        .expense-description {
            font-weight: bold;
            color: #333;
        }

        .expense-amount {
            color: #f57c00;
            font-weight: bold;
        }

        .expense-category {
            font-size: 0.8rem;
            color: #666;
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .trip-financial-summary {
            background: #e8f5e9;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid #4CAF50;
        }

        .trip-financial-summary h4 {
            margin-bottom: 10px;
            color: #2e7d32;
        }

        .trip-financial-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .trip-financial-row.total {
            font-weight: bold;
            border-top: 1px dashed #a5d6a7;
            padding-top: 5px;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .nav-buttons {
                justify-content: stretch;
            }

            .btn {
                flex: 1;
                justify-content: center;
            }

            .trips-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 10% auto;
                width: 95%;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .trip-header {
                flex-direction: column;
                gap: 10px;
            }

            .trip-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-plane-departure"></i> Sistema de Gestión - Nómadas Tours</h1>
            <p>Administra viajes, clientes y pagos de forma profesional</p>
        </div>

        <div class="main-nav">
            <div class="nav-buttons">
                <button class="btn btn-primary" onclick="showSection('dashboard')">
                    <i class="fas fa-home"></i> Dashboard
                </button>
                <button class="btn btn-primary" onclick="showNewTripModal()">
                    <i class="fas fa-plus"></i> Nuevo Viaje
                </button>
                <button class="btn btn-secondary" onclick="showSection('reports')">
                    <i class="fas fa-chart-bar"></i> Reportes
                </button>
                <button class="btn btn-warning" onclick="exportData('excel')">
                    <i class="fas fa-file-excel"></i> Exportar Excel
                </button>
                <button class="btn btn-warning" onclick="exportData('csv')">
                    <i class="fas fa-file-csv"></i> Exportar CSV
                </button>
                <button class="btn btn-warning" onclick="exportData('json')">
                    <i class="fas fa-file-code"></i> Exportar JSON
                </button>
                <button class="btn btn-secondary" onclick="exportProjectCode()">
                    <i class="fas fa-download"></i> Exportar Código
                </button>
            </div>
        </div>

        <div class="content-area">
            <!-- Dashboard Section -->
            <div id="dashboard" class="section active">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar viajes o clientes..." onkeyup="filterTrips()">
                
                <div class="summary-cards" id="summaryCards">
                    <!-- Summary cards will be populated by JavaScript -->
                </div>

                <div class="trips-grid" id="tripsContainer">
                    <!-- Trip cards will be populated by JavaScript -->
                </div>
            </div>

            <!-- Reports Section -->
            <div id="reports" class="section">
                <h2><i class="fas fa-chart-bar"></i> Reportes y Estadísticas</h2>
                <div id="reportsContent">
                    <!-- Reports content will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Trip Modal -->
        <div id="tripModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="tripModalTitle">Nuevo Viaje</h2>
                    <span class="close" onclick="closeTripModal()">×</span>
                </div>
                <form id="tripForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tripName">Nombre del Viaje *</label>
                            <input type="text" id="tripName" required="">
                        </div>
                        <div class="form-group">
                            <label for="tripDestination">Destino *</label>
                            <input type="text" id="tripDestination" required="">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tripStartDate">Fecha de Inicio *</label>
                            <input type="date" id="tripStartDate" required="">
                        </div>
                        <div class="form-group">
                            <label for="tripEndDate">Fecha de Fin *</label>
                            <input type="date" id="tripEndDate" required="">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="tripPrice">Precio Total *</label>
                        <input type="number" id="tripPrice" min="0" step="0.01" required="">
                    </div>
                    <div class="form-group">
                        <label for="tripDescription">Descripción</label>
                        <textarea id="tripDescription" rows="4" placeholder="Descripción detallada del viaje..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="tripImages">URLs de Imágenes (separadas por comas)</label>
                        <input type="text" id="tripImages" placeholder="https://ejemplo.com/imagen1.jpg, https://ejemplo.com/imagen2.jpg">
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Guardar Viaje
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closeTripModal()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Clients Modal -->
        <div id="clientsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="clientsModalTitle">Gestionar Clientes</h2>
                    <span class="close" onclick="closeClientsModal()">×</span>
                </div>
                <div id="clientsContent">
                    <!-- Clients content will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Client Form Modal -->
        <div id="clientFormModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="clientFormModalTitle">Nuevo Cliente</h2>
                    <span class="close" onclick="closeClientFormModal()">×</span>
                </div>
                <form id="clientForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="clientName">Nombre Completo *</label>
                            <input type="text" id="clientName" required="">
                        </div>
                        <div class="form-group">
                            <label for="clientEmail">Email</label>
                            <input type="email" id="clientEmail">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="clientPhone">Teléfono *</label>
                            <input type="tel" id="clientPhone" required="">
                        </div>
                        <div class="form-group">
                            <label for="clientDocument">Documento de Identidad</label>
                            <input type="text" id="clientDocument">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="clientNotes">Notas Adicionales</label>
                        <textarea id="clientNotes" rows="3" placeholder="Observaciones, referencias, etc."></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Guardar Cliente
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closeClientFormModal()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Payment Modal -->
        <div id="paymentModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Registrar Abono</h2>
                    <span class="close" onclick="closePaymentModal()">×</span>
                </div>
                <form id="paymentForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="paymentAmount">Monto del Abono *</label>
                            <input type="number" id="paymentAmount" min="0.01" step="0.01" required="">
                        </div>
                        <div class="form-group">
                            <label for="paymentDate">Fecha del Pago *</label>
                            <input type="date" id="paymentDate" required="">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="paymentMethod">Método de Pago *</label>
                        <select id="paymentMethod" required="">
                            <option value="">Seleccionar método</option>
                            <option value="efectivo">Efectivo</option>
                            <option value="transferencia">Transferencia Bancaria</option>
                            <option value="tarjeta_credito">Tarjeta de Crédito</option>
                            <option value="tarjeta_debito">Tarjeta de Débito</option>
                            <option value="deposito">Depósito Bancario</option>
                            <option value="cheque">Cheque</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="paymentReference">Referencia/Número de Transacción</label>
                        <input type="text" id="paymentReference" placeholder="Número de referencia, autorización, etc.">
                    </div>
                    <div class="form-group">
                        <label for="paymentNotes">Notas del Pago</label>
                        <textarea id="paymentNotes" rows="3" placeholder="Observaciones adicionales sobre el pago..."></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Registrar Abono
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closePaymentModal()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Expense Modal -->
        <div id="expenseModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Registrar Gasto</h2>
                    <span class="close" onclick="closeExpenseModal()">×</span>
                </div>
                <form id="expenseForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expenseDescription">Descripción del Gasto *</label>
                            <input type="text" id="expenseDescription" required="">
                        </div>
                        <div class="form-group">
                            <label for="expenseAmount">Monto *</label>
                            <input type="number" id="expenseAmount" min="0.01" step="0.01" required="">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expenseDate">Fecha del Gasto *</label>
                            <input type="date" id="expenseDate" required="">
                        </div>
                        <div class="form-group">
                            <label for="expenseCategory">Categoría *</label>
                            <select id="expenseCategory" required="">
                                <option value="">Seleccionar categoría</option>
                                <option value="transporte">Transporte</option>
                                <option value="hospedaje">Hospedaje</option>
                                <option value="alimentacion">Alimentación</option>
                                <option value="entradas">Entradas/Boletos</option>
                                <option value="guias">Guías Turísticos</option>
                                <option value="combustible">Combustible</option>
                                <option value="peajes">Peajes</option>
                                <option value="varios">Varios</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="expenseNotes">Notas Adicionales</label>
                        <textarea id="expenseNotes" rows="3" placeholder="Observaciones adicionales sobre el gasto..."></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Registrar Gasto
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closeExpenseModal()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification" class="notification"></div>

    <script>
        // Global variables
        let trips = JSON.parse(localStorage.getItem('travelAgencyTrips')) || [];
        let currentTripId = null;
        let currentClientId = null;
        let editingTrip = false;
        let editingClient = false;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderDashboard();
            
            // Set today's date as default for payment date
            document.getElementById('paymentDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('expenseDate').value = new Date().toISOString().split('T')[0];
        });

        // Data persistence functions
        function saveData() {
            localStorage.setItem('travelAgencyTrips', JSON.stringify(trips));
        }

        function loadData() {
            const savedTrips = localStorage.getItem('travelAgencyTrips');
            if (savedTrips) {
                trips = JSON.parse(savedTrips);
            }
        }

        // Utility functions
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('es-MX', {
                style: 'currency',
                currency: 'MXN'
            }).format(amount);
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('es-MX', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Notification system
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Navigation functions
        function showSection(sectionId) {
            // Hide all sections
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => section.classList.remove('active'));
            
            // Show the selected section
            document.getElementById(sectionId).classList.add('active');
            
            if (sectionId === 'dashboard') {
                renderDashboard();
            } else if (sectionId === 'reports') {
                renderReports();
            }
        }

        // Dashboard rendering
        function renderDashboard() {
            renderSummaryCards();
            renderTrips();
        }

        function renderSummaryCards() {
            const summaryContainer = document.getElementById('summaryCards');
            const totalTrips = trips.length;
            const totalClients = trips.reduce((sum, trip) => sum + (trip.clients ? trip.clients.length : 0), 0);
            const totalRevenue = trips.reduce((sum, trip) => {

                    const totalPaid = client.payments ? client.payments.reduce((paySum, payment) => paySum + payment.amount, 0) : 0;

                }, 0) : 0;
                return sum + tripPending;

        function editTrip(tripId) {

            currentTripId = tripId;

            document.getElementById('tripName').value = trip.name;
            document.getElementById('tripDestination').value = trip.destination;

        function deleteTrip(tripId) {
            const trip = trips.find(t => t.id === tripId);
            if (!trip) return;

            const clientsCount = trip.clients ? trip.clients.length : 0;
            const expensesCount = trip.expenses ? trip.expenses.length : 0;
            const confirmMessage = `¿Estás seguro de que quieres eliminar el viaje "${trip.name}"?\n\nEsto también eliminará ${clientsCount} cliente(s), ${expensesCount} gasto(s) y todos sus registros asociados.`;

            if (confirm(confirmMessage)) {
                trips = trips.filter(t => t.id !== tripId);
                saveData();
                renderDashboard();
                showNotification('Viaje eliminado exitosamente', 'success');
            }
        }

            document.getElementById('tripModal').style.display = 'none';
            document.getElementById('tripForm').reset();
            currentTripId = null;
            editingTrip = false;

                name: document.getElementById('tripName').value.trim(),
                destination: document.getElementById('tripDestination').value.trim(),
                startDate: document.getElementById('tripStartDate').value,
                endDate: document.getElementById('tripEndDate').value,
                price: parseFloat(document.getElementById('tripPrice').value),
                description: document.getElementById('tripDescription').value.trim(),
                images: document.getElementById('tripImages').value.split(',').map(url => url.trim()).filter(url => url)
            };

            // Validation
            if (!formData.name || !formData.destination || !formData.startDate || !formData.endDate || !formData.price) {
                showNotification('Por favor completa todos los campos requeridos', 'error');
                return;
            }

            if (new Date(formData.startDate) >= new Date(formData.endDate)) {
                showNotification('La fecha de inicio debe ser anterior a la fecha de fin', 'error');
                return;
            }

            if (formData.price <= 0) {
                showNotification('El precio debe ser mayor que 0', 'error');
                return;
            }

            if (editingTrip && currentTripId) {
                const tripIndex = trips.findIndex(t => t.id === currentTripId);
                if (tripIndex !== -1) {
                    trips[tripIndex] = { ...trips[tripIndex], ...formData };
                    showNotification('Viaje actualizado exitosamente', 'success');
                }
            } else {
                const newTrip = {
                    id: generateId(),
                    ...formData,
                    clients: [],
                    expenses: [],
                    createdAt: new Date().toISOString()
                };
                trips.push(newTrip);
                showNotification('Viaje creado exitosamente', 'success');

            saveData();
            closeTripModal();
            renderDashboard();
        });

            document.getElementById('clientFormModal').style.display = 'block';

            const trip = trips.find(t => t.id === currentTripId);
            if (!trip) return;
            
            const client = trip.clients.find(c => c.id === clientId);
            if (!client) return;

            const paymentsCount = client.payments ? client.payments.length : 0;

                ? `¿Estás seguro de que quieres eliminar a "${client.name}"?\n\nEsto también eliminará ${paymentsCount} pago(s) registrado(s).`

                (!editingClient || c.id !== currentClientId)
            );

            if (!client || !client.payments) return;

                amount: parseFloat(document.getElementById('paymentAmount').value),
                date: document.getElementById('paymentDate').value,
                method: document.getElementById('paymentMethod').value,
                reference: document.getElementById('paymentReference').value.trim(),
                notes: document.getElementById('paymentNotes').value.trim()
            };

            if (!formData.amount || !formData.date || !formData.method) {
                showNotification('Por favor completa todos los campos requeridos', 'error');
                return;
            }

            if (formData.amount <= 0) {
                showNotification('El monto debe ser mayor que 0', 'error');
                return;
            }

            // Calculate current paid amount
            const currentPaid = client.payments ? client.payments.reduce((sum, payment) => sum + payment.amount, 0) : 0;
            const remainingAmount = trip.price - currentPaid;

            if (formData.amount > remainingAmount) {
                if (!confirm(`El monto ingresado (${formatCurrency(formData.amount)}) es mayor al saldo pendiente (${formatCurrency(remainingAmount)}).\n\n¿Deseas continuar de todos modos?`)) {
                    return;
                }
            }

            const newPayment = {
                id: generateId(),
                ...formData,
                createdAt: new Date().toISOString()
            };

            if (!client.payments) client.payments = [];
            client.payments.push(newPayment);

            // Sort payments by date (newest first)
            client.payments.sort((a, b) => new Date(b.date) - new Date(a.date));

            saveData();
            closePaymentModal();
            renderClientsModal(trip);
            renderDashboard();
            
            const newBalance = remainingAmount - formData.amount;
            const message = newBalance <= 0 
                ? `Pago registrado exitosamente. ¡Cliente "${client.name}" ha completado su pago!`
                : `Pago registrado exitosamente. Saldo pendiente: ${formatCurrency(newBalance)}`;
            
            showNotification(message, 'success');
        });

        // WhatsApp reminder function
        function sendWhatsAppReminder(clientId) {
            const trip = trips.find(t => t.id === currentTripId);
            if (!trip) return;
            
            const client = trip.clients.find(c => c.id === clientId);
            if (!client) return;

            const clientPaid = client.payments ? client.payments.reduce((sum, payment) => sum + payment.amount, 0) : 0;
            const clientPending = trip.price - clientPaid;

            // Format phone number for WhatsApp
            let phoneNumber = client.phone.replace(/\D/g, '');
            if (phoneNumber.length === 10 && !phoneNumber.startsWith('52')) {
                phoneNumber = '52' + phoneNumber;
            }

            // Create message
            const message = encodeURIComponent(
                `Hola ${client.name}, te recordamos que tienes un saldo pendiente de ${formatCurrency(clientPending)} ` +
                `para tu viaje a ${trip.destination} del ${formatDate(trip.startDate)} al ${formatDate(trip.endDate)}. ` +
                `Por favor realiza tu pago a la brevedad. Si tienes alguna duda, contáctanos. ¡Gracias!`
            );

            // Open WhatsApp
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;
            window.open(whatsappUrl, '_blank');
            
            showNotification('Abriendo WhatsApp para enviar recordatorio', 'success');
        }

            const trip = trips.find(t => t.id === currentTripId);

            const expense = trip.expenses.find(e => e.id === expenseId);
            if (!expense) return;

            document.getElementById('expenseDescription').value = expense.description;
            document.getElementById('expenseAmount').value = expense.amount;
            document.getElementById('expenseDate').value = expense.date;
            document.getElementById('expenseCategory').value = expense.category;
            document.getElementById('expenseNotes').value = expense.notes || '';

            const trip = trips.find(t => t.id === currentTripId);

            if (!expense) return;

            if (confirm(`¿Estás seguro de que quieres eliminar el gasto "${expense.description}" por ${formatCurrency(expense.amount)}?`)) {

                showNotification('Gasto eliminado exitosamente', 'success');

                                                            <div style="font-weight: bold; color: #4caf50;">${formatCurrency(clientPaid)}</div>
                                                            <div style="font-size: 0.8rem; color: ${clientPending > 0 ? '#f44336' : '#4caf50'};">
                                                                ${clientPending > 0 ? `Debe: ${formatCurrency(clientPending)}` : 'Completo'}
                                                            </div>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </details>
                                ` : '<p style="text-align: center; color: #666; font-style: italic; margin-top: 15px;">No hay clientes registrados</p>'}
                                
                                ${trip.expenses && trip.expenses.length > 0 ? `
                                    <details style="margin-top: 15px;">
                                        <summary style="cursor: pointer; font-weight: bold; color: #555; padding: 5px 0;">
                                            Ver detalles de gastos (${trip.expenses.length})
                                        </summary>
                                        <div style="margin-top: 10px; max-height: 200px; overflow-y: auto;">
                                            ${trip.expenses.map(expense => `
                                                <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: white; border-radius: 6px; margin-bottom: 5px; border-left: 3px solid #ff9800;">
                                                    <div>
                                                        <div style="font-weight: bold;">${expense.description}</div>
                                                        <div style="font-size: 0.8rem; color: #666;">${expense.category.replace('_', ' ').toUpperCase()}</div>
                                                    </div>
                                                    <div style="text-align: right;">
                                                        <div style="font-weight: bold; color: #ff9800;">${formatCurrency(expense.amount)}</div>
                                                        <div style="font-size: 0.8rem; color: #666;">${formatDate(expense.date)}</div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </details>
                                ` : ''}
                            </div>
                        `;
                    }).join('') : '<p style="text-align: center; color: #666;">No hay viajes para analizar</p>'}
                </div>
            `;
        }

        // Export functions
        function exportData(format) {
            if (trips.length === 0) {
                showNotification('No hay datos para exportar', 'warning');
                return;
            }

            let data, filename, mimeType;

            if (format === 'excel' || format === 'csv') {
                // Prepare data for CSV/Excel
                const csvData = [];
                
                // Headers
                csvData.push([
                    'Viaje', 'Destino', 'Fecha Inicio', 'Fecha Fin', 'Precio por Persona',
                    'Cliente', 'Email', 'Teléfono', 'Documento', 'Monto Pagado', 'Monto Pendiente',
                    'Fecha Pago', 'Método Pago', 'Referencia', 'Notas Cliente', 'Notas Pago',
                    'Gasto Descripción', 'Gasto Categoría', 'Gasto Monto', 'Gasto Fecha', 'Gasto Notas'
                ]);

                trips.forEach(trip => {
                    // Add trip data without clients
                    if (!trip.clients || trip.clients.length === 0) {
                        csvData.push([
                            trip.name, trip.destination, trip.startDate, trip.endDate, trip.price,
                            '', '', '', '', 0, trip.price, '', '', '', '', '', '', '', '', '', ''
                        ]);
                    } else {
                        trip.clients.forEach(client => {
                            const totalPaid = client.payments ? client.payments.reduce((sum, payment) => sum + payment.amount, 0) : 0;
                            const pending = trip.price - totalPaid;
                            
                            if (!client.payments || client.payments.length === 0) {
                                csvData.push([
                                    trip.name, trip.destination, trip.startDate, trip.endDate, trip.price,
                                    client.name, client.email || '', client.phone || '', client.document || '',
                                    totalPaid, pending, '', '', '', client.notes || '', '', '', '', '', ''
                                ]);
                            } else {
                                client.payments.forEach(payment => {
                                    csvData.push([
                                        trip.name, trip.destination, trip.startDate, trip.endDate, trip.price,
                                        client.name, client.email || '', client.phone || '', client.document || '',
                                        totalPaid, pending, payment.date, payment.method, payment.reference || '',
                                        client.notes || '', payment.notes || '', '', '', '', '', ''
                                    ]);
                                });
                            }
                        });
                    }
                    
                    // Add expenses
                    if (trip.expenses && trip.expenses.length > 0) {
                        trip.expenses.forEach(expense => {
                            csvData.push([
                                trip.name, trip.destination, trip.startDate, trip.endDate, trip.price,
                                '', '', '', '', '', '', '', '', '', '', '',
                                expense.description, expense.category, expense.amount, expense.date, expense.notes || ''
                            ]);
                        });
                    }
                });

                if (format === 'csv') {
                    data = csvData.map(row => 
                        row.map(cell => 
                            typeof cell === 'string' && cell.includes(',') ? `"${cell}"` : cell
                        ).join(',')
                    ).join('\n');
                    filename = `agencia_viajes_${new Date().toISOString().split('T')[0]}.csv`;
                    mimeType = 'text/csv;charset=utf-8;';
                } else {
                    // For Excel, we'll create a more complex CSV that Excel can handle better
                    data = '\ufeff' + csvData.map(row => 
                        row.map(cell => 
                            typeof cell === 'string' && (cell.includes(',') || cell.includes('"')) 
                                ? `"${cell.replace(/"/g, '""')}"` 
                                : cell
                        ).join(',')
                    ).join('\n');
                    filename = `agencia_viajes_${new Date().toISOString().split('T')[0]}.csv`;
                    mimeType = 'application/vnd.ms-excel;charset=utf-8;';
                }
            } else if (format === 'json') {
                // Export complete JSON data
                const exportData = {
                    exportDate: new Date().toISOString(),
                    totalTrips: trips.length,
                    totalClients: trips.reduce((sum, trip) => sum + (trip.clients ? trip.clients.length : 0), 0),
                    trips: trips
                };
                
                data = JSON.stringify(exportData, null, 2);
                filename = `agencia_viajes_${new Date().toISOString().split('T')[0]}.json`;
                mimeType = 'application/json;charset=utf-8;';
            }

            // Create and download file
            const blob = new Blob([data], { type: mimeType });
            const link = document.createElement('a');
            
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                showNotification(`Datos exportados exitosamente: ${filename}`, 'success');
            } else {
                showNotification('Tu navegador no soporta la descarga de archivos', 'error');
            }
        }

        function exportProjectCode() {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
            const link = document.createElement('a');
            
            const filename = `sistema_agencia_viajes_${new Date().toISOString().split('T')[0]}.html`;
            
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                showNotification(`Código del proyecto exportado: ${filename}`, 'success');
            } else {
                showNotification('Tu navegador no soporta la descarga de archivos', 'error');
            }
        }

        // Modal handling - close modals when clicking outside
        window.addEventListener('click', function(event) {
            const modals = ['tripModal', 'clientsModal', 'clientFormModal', 'paymentModal', 'expenseModal'];
            modals.forEach(modalId => {
                const modal = document.getElementById(modalId);
                if (event.target === modal) {
                    modal.style.display = 'none';
                    // Reset forms and variables when closing modals
                    if (modalId === 'tripModal') {
                        document.getElementById('tripForm').reset();
                        currentTripId = null;
                        editingTrip = false;
                    } else if (modalId === 'clientFormModal') {
                        document.getElementById('clientForm').reset();
                        currentClientId = null;
                        editingClient = false;
                    } else if (modalId === 'paymentModal') {
                        document.getElementById('paymentForm').reset();
                        currentClientId = null;
                    } else if (modalId === 'expenseModal') {
                        document.getElementById('expenseForm').reset();
                    } else if (modalId === 'clientsModal') {
                        currentTripId = null;
                    }
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            // ESC key to close modals
            if (event.key === 'Escape') {
                const openModals = document.querySelectorAll('.modal');
                openModals.forEach(modal => {
                    if (modal.style.display === 'block') {
                        modal.style.display = 'none';
                    }
                });
            }
            
            // Ctrl+N for new trip
            if (event.ctrlKey && event.key === 'n') {
                event.preventDefault();
                showNewTripModal();
            }
        });

        // Auto-save functionality
        setInterval(() => {
            // This interval ensures data is saved every 30 seconds (backup)
            // Data is already saved on every change, but this is an extra safety measure
            if (trips.length > 0) {
                saveData();
            }
        }, 30000);

        // Initialize tooltips and other UI enhancements
        document.addEventListener('DOMContentLoaded', function() {
            // Add loading animation
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s ease';
                document.body.style.opacity = '1';
            }, 100);
        });

        // Validation helpers
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePhone(phone) {
            const re = /^[\d\s\-\+\(\)]+$/;
            return phone === '' || re.test(phone);
        }

        // Enhanced form validation
        document.getElementById('clientEmail').addEventListener('blur', function() {
            const email = this.value.trim();
            if (email && !validateEmail(email)) {
                this.style.borderColor = '#f44336';
                showNotification('Por favor ingresa un email válido', 'warning');
            } else {
                this.style.borderColor = '#ddd';
            }
        });

        document.getElementById('clientPhone').addEventListener('blur', function() {
            const phone = this.value.trim();
            if (!validatePhone(phone)) {
                this.style.borderColor = '#f44336';
                showNotification('Por favor ingresa un teléfono válido', 'warning');
            } else {
                this.style.borderColor = '#ddd';
            }
        });
    </script>

</body></html>
